services:
  postgres:
    image: postgres:16-alpine
    container_name: fegih-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fegih
      POSTGRES_PASSWORD: fegih_local_password
      POSTGRES_DB: fegih
    ports:
      - "5432:5432"
    volumes:
      - fegih_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fegih -d fegih"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  fegih_postgres_data:
    name: fegih_postgres_data
